[program:myshop-queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=C:/dev/myshop
command=php artisan queue:work database --queue=default --sleep=3 --tries=8 --timeout=120
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=C:/dev/myshop/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=3600
